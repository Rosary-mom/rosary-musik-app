<h1>Noten schreiben</h1>
<p>Tippe ins Raster: eine Note pro Spalte (Viertel). Tonvorrat D-Dur von D4 bis D5, dazu C5 fürs Baumeister-Leitmotiv.</p>
<div class="row"><button id="nt-play">▶ Abspielen</button><button id="nt-stop">■ Stopp</button><button id="nt-bau">Leitmotiv laden</button><button id="nt-unison" style="background:#0F0;color:#000">✦ Unison D-Dur Kadenz</button><button id="nt-clear">Leeren</button><button id="nt-mid">.mid speichern</button>
<label>Tempo <input id="nt-tempo" type="number" min="40" max="200" value="80" style="width:70px"></label><label>Stimmung: <select id="nt-tuning" style="padding:6px;background:#111;color:#FFD700;border:1px solid #FFD700;font-size:15px"><option value="434">434 Hz (Naturton)</option><option value="432">432 Hz (Solfeggio)</option><option value="440">440 Hz (Konzert)</option></select></label><label>Klangfarbe: <select id="nt-sound" style="padding:6px;background:#111;color:#FFD700;border:1px solid #FFD700;font-size:15px"><option value="unison_harfe">Unison Harfe</option><option value="chor">Kathedral-Chor (Singstimme)</option><option value="unison_pad">Unison Pad</option><option value="glocke">Glocke / Chime</option></select></label><label style="color:#FFD700;margin-left:8px;"><input type="checkbox" id="nt-voice-notes"> Tonname singen (Solfège/Noten)</label></div>
