<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7B1E2B"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icon-192.png"><title>Noten schreiben</title>
<style>body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif}#nt{padding:12px;max-width:1000px;margin:0 auto}
#nt h1{color:#FFD700;font-family:Rockwell,serif}#nt a{color:#FFD700}
#nt .wrap{overflow-x:auto}#nt table{border-collapse:collapse}#nt td,#nt th{border:1px solid #444;width:40px;height:34px;text-align:center;padding:0}
#nt th{color:#FFD700;font-size:13px;background:#111}#nt td{cursor:pointer;background:#111}#nt td.on{background:#FFD700}#nt td.play{outline:2px solid #0F0}

<p><a href="../">← Start</a></p><h1>Noten schreiben</h1>
<p>Tippe ins Raster: eine Note pro Spalte (Viertel). Tonvorrat D-Dur von D4 bis D5, dazu C5 fürs Baumeister-Leitmotiv.</p>
<div class="row"><button id="nt-play">▶ Abspielen</button><button id="nt-stop">■ Stopp</button><button id="nt-bau">Leitmotiv laden</button><button id="nt-clear">Leeren</button><button id="nt-mid">.mid speichern</button>
<label>Tempo <input id="nt-tempo" type="number" min="40" max="200" value="80" style="width:70px"></label></div>
<div class="wrap"><table id="nt-grid"></table></div><p id="nt-info"></p></div>
<script src="noten.js"></script><script>if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("../service-worker.js",{scope:"../"});</script></body></html>
